<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Apply the app-local preference before the page is painted.
      try {
        const theme = localStorage.getItem('quicknote.theme');
        if (['system', 'light', 'dark', 'dracula', 'nord', 'catppuccin'].includes(theme)) {
          document.documentElement.dataset.theme = theme;
        }
      } catch { /* Restricted storage falls back to the system appearance. */ }
    </script>
    <title>Quicknote</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
